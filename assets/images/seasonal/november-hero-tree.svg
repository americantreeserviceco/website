  <style>
    .leaf { animation: fall 7s ease-in infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .l2 { animation-delay: 2s; } .l3 { animation-delay: 4s; } .l4 { animation-delay: 5.5s; }
    @keyframes fall { 0% { transform: translate(0,0) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-40px,150px) rotate(200deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .leaf { animation: none; opacity: 1; } }
  </style>
