<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" aria-hidden="true">
  <style>
    .orbit { transform-box: view-box; transform-origin: 180px 100px; animation: carousel 16s linear infinite; }
    @keyframes carousel { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
  </style>
  <defs>
    <g id="heart" stroke="#8e2348" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 13C-4 9-15 2-15-6C-15-15-5-18 0-10C5-18 15-15 15-6C15 2 4 9 0 13Z"/>
      <path d="M-10-6C-10-10-7-11-5-9" fill="none" stroke="#fff1f5" stroke-width="2"/>
    </g>
  </defs>
  <g class="orbit">
    <use href="#heart" transform="translate(180 30) rotate(-15)" fill="#ef476f"/>
    <use href="#heart" transform="translate(340 100) rotate(15)" fill="#f78fb3"/>
    <use href="#heart" transform="translate(180 170) rotate(15)" fill="#d62855"/>
    <use href="#heart" transform="translate(20 100) rotate(-15)" fill="#ffb3c6"/>
  </g>
</svg>
