        // Function to handle tab switching
        function switchTab(key) {
            // Update active state for desktop tabs
            ['lakewood', 'arvada', 'wheatridge'].forEach(k => {
                const dTab = document.getElementById(`tab-${k}`);
                const mTab = document.getElementById(`mob-tab-${k}`);

                if (k === key) {
                    dTab.className = "active-tab py-4 px-2 text-sm font-medium transition-colors flex items-center space-x-2";
                    mTab.className = "active-mobile-tab text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-300";
                } else {
                    dTab.className = "text-slate-600 hover:text-slate-900 py-4 px-2 text-sm font-medium transition-colors flex items-center space-x-2";
                    mTab.className = "bg-white text-slate-700 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-300";
                }
            });

            // Render selected page
            renderPage(key);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openModal() {
            document.getElementById('estimateModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('estimateModal').classList.add('hidden');
        }

        const menuToggle = document.querySelector('.site-nav-toggle');
        const navigation = document.querySelector('.site-nav-container > nav');
        menuToggle.addEventListener('click', () => {
            const isOpen = navigation.classList.toggle('is-open');
            menuToggle.setAttribute('aria-expanded', String(isOpen));
            menuToggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
        });

        navigation.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navigation.classList.remove('is-open');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Open menu');
            });
        });

        // Initialize with Lakewood on page load
        window.onload = function() {
            renderPage('lakewood');
        };
